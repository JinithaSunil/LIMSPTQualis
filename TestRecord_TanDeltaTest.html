<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>TEST RECORD</title>
    <!--<link rel="stylesheet" href="http://CiscoLIMS.rnisolutions.in:8608/css/CRF_style.css" media="all" />-->
    <link rel="stylesheet" href="css/CRF_style.css" media="all" />
    <link rel="stylesheet" href="../css/CRF_style.css" media="all" />
    <style>
        .space {
            border-collapse: separate;
            border-spacing: 0 15px;
        }

        .page {
            width: 21cm;
            min-height: 29.7cm;
            padding: 2cm;
            margin: 1cm auto;
            border: 1px #D3D3D3 solid;
            border-radius: 5px;
            background: white;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
        }
    </style>
    <style media="screen">
        .noPrint1 {
        }

        .noScreen1 {
            display: none;
        }

        .noPrint {
        }

        .noScreen {
            display: none;
        }

        #header {
            display: block;
            position: relative;
            left: 0px;
            top: 0px;
            right: 0px;
            font-size: 10px;
        }

        #footer {
            display: block;
            position: relative;
            left: 0px;
            bottom: 0px;
            right: 0px;
            font-size: 10px;
        }
    </style>
    <style>
        .space {
            border-collapse: separate;
            border-spacing: 0 15px;
        }

        .tab1 {
            border: 1px solid;
            border-bottom: 1px solid;
        }

            .tab1 td {
                border: 1px solid;
                padding: 5px;
                text-align: left;
            }

        .blank {
            border: none !important;
            padding: 5px;
        }
    </style>
    <style type="text/css" media="print">
        @page {
            size: auto; /* auto is the initial value */
            margin: 0; /* this affects the margin in the printer settings */
        }
    </style>
</head>
<body>
    <center>
        <div class='table-responsive'>
            <table>
                <thead>                    
                    <tr>
                        <td>
                            {Header}
                        </td>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td style="margin-top:250px">
                            {TestDetails}
                        </td>
                    </tr>
                    
                </tbody>
                <tfoot>
                    <tr>
                        <td>
                            {Footer}
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </center>
</body>
</html>
