<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Enquiry Report</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="assets/plugins/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="assets/css/style2.css" rel="stylesheet" type="text/css" />
    <style>
        .enquiry-header {
            background-color: #B94D8F;
            color: white;
            padding: 10px 15px;
            margin-bottom: 10px;
            font-size: 20px;
        }

        .enquiry-info {
            padding: 10px 0;
        }

        .admin-text {
            font-size: 18px;
            color: #007bff;
            text-align: right;
            padding-top: 10px;
        }

        .company-info {
            text-align: right;
        }
        .company-logo {
            text-align: right;
            
        }

        .enquiry-details {
            margin-top: 20px;
        }

        .enquiry-content {
            border-top: 1px solid #ddd;
            padding-top: 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <!-- Header Section -->
            <div class="col-2">
                <div class="enquiry-header">Enquiry</div>
            </div>
            
                <div class="col-5">
                    <div class="enquiry-info">
                        <span>
                            Enquiry ID: {EnquiryID}<br>
                            Enquiry Date: {EnquiryDate}
                        </span>
                    </div>
                </div>
                <div class="col-5">
                    <div class="company-logo">
                        <img src="assets/img/logo.png" class="img-responsive" alt="Qualis Logo" height="100">
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-3">
            <!-- Category and Vendor Section - Left Aligned -->
            <div class="col-6">
                <div>
                    Category: {PurchaseSubGroupName}<br>
                    Vendor: {VendorName}
                </div>
            </div>

            <!-- Company Info - Right Aligned -->
            <div class="col-6 company-info">
                <div>
                    <strong>COMPANY NAME:PTQualis</strong><br>
                    
                    Banten,Indonesia<br>
                    Phone: +91-123456789<br>
                    E-mail: {purchaseEmail}
                </div>
            </div>
        </div>

        <!-- Enquiry Details Section -->
        <div class="row enquiry-details">
            <div class="col-12">
                <h4>Enquiry Details</h4>
                <div class="enquiry-content">
                    {Enquiry}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
