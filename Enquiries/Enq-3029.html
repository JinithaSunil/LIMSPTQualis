<!DOCTYPE html>
<html>
<head>

    <style>
        .enquiry-header {
            background-color: #B94D8F;

            margin-bottom: 10px;
            font-size: 20px;
        }

        .enquiry-info {

        }

            font-size: 18px;
            color: #007bff;

        }

            text-align: right;
        }
        .company-logo {

        }

    <div class="container">
        <div class="row">

            <div class="col-2">

            </div>
            
                <div class="col-5">
                    <div class="enquiry-info">
                        <span>
                            Enquiry ID: 3029<br>
                            Enquiry Date: 3/31/2025 10:45:35 AM
                        </span>
                    </div>
                </div>

                .enquiry-details { margin-bottom: 20px; }
                .enquiry-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                .enquiry-table th, .enquiry-table td { 
                    border: 1px solid #ddd; 
                    padding: 8px; 
                    text-align: center; 
                }
                .enquiry-table th { 
                    background-color: #B94D8F; 
                    color: white; 
                    text-align: center;
                }
                .enquiry-table tr:nth-child(even) { background-color: #f2f2f2;  text-align: center;}
                .ok-button {

                    text-align: center;
                }

                    background-color: #B94D8F;
                    color: white;
                    border: none;

                }
                .ok-button button:hover {
                    background-color: #9a3a6f;
                }
            </style><div class='enquiry-details'><table class='enquiry-table'><thead><tr><th>PR#</th><th>Item Description</th><th>Quantity</th><th>UOM</th></tr></thead><tbody><tr><td><a href='ViewPR.aspx?ID=2020' target='_blank'>2020</a></td><td>Electrical conductor</td><td>10</td><td>°C</td></tr></tbody></table></div>
